# LiteLLM proxy — one entry per model you want to use.
# Backend calls this with `model: <model_name>`; LiteLLM routes it.
# Docs: https://docs.litellm.ai/docs/providers

model_list:
  # ── GitHub Copilot subscription ─────────────────────────────────────────
  # First call triggers OAuth device flow: open the URL, paste code, done.
  # Token is cached under ~/.config/litellm/ (or the mounted volume in docker).
  - model_name: copilot-sonnet
    litellm_params:
      model: github_copilot/claude-sonnet-4.5
  - model_name: copilot-gpt5
    litellm_params:
      model: github_copilot/gpt-5
  - model_name: copilot-gpt4
    litellm_params:
      model: github_copilot/gpt-4.1

  # ── OpenAI ──────────────────────────────────────────────────────────────
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ── Anthropic ───────────────────────────────────────────────────────────
  - model_name: claude
    litellm_params:
      model: anthropic/claude-3-5-sonnet-latest
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── Google Gemini ───────────────────────────────────────────────────────
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

  # ── Groq (fast + free tier) ─────────────────────────────────────────────
  - model_name: groq
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # ── Local via Ollama (no keys, free) ────────────────────────────────────
  - model_name: local
    litellm_params:
      model: ollama/llama3.2
      api_base: http://host.docker.internal:11434

litellm_settings:
  drop_params: true              # ignore params some providers don't support
  set_verbose: false

general_settings:
  telemetry: false
