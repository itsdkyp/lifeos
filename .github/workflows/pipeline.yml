name: pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (leave blank to derive from git ref)"
        required: false

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: itsdkyp/lifeos

jobs:
  # ── Fast checks ─────────────────────────────────────────────────────────────
  # Typecheck + smoke run on native Bun, complete in ~30s. Gates the slow Docker
  # build below so broken code never wastes 8 min of arm64 emulation time.
  typecheck-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Backend deps
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Backend typecheck
        working-directory: backend
        run: bunx tsc --noEmit

      - name: Frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend typecheck
        working-directory: frontend
        run: bunx tsc --noEmit

      - name: Start backend in background
        working-directory: backend
        run: |
          nohup bun run src/index.ts > /tmp/backend.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then
              echo "backend up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend never came up:"
          cat /tmp/backend.log
          exit 1

      - name: Run smoke suite
        working-directory: backend
        run: bun run smoke

      - name: Backend logs on failure
        if: failure()
        run: cat /tmp/backend.log 2>/dev/null || echo "(no backend.log)"

  # ── Docker: multi-arch build (+ push on main) ────────────────────────────────
  # Only runs if the fast checks passed. On PRs: build both arches, no push.
  # On main / tags: build + push to Docker Hub.
  docker:
    runs-on: ubuntu-latest
    needs: typecheck-and-smoke
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short,enable=true
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.HAVE_TOKEN == 'true'
        env:
          HAVE_TOKEN: ${{ secrets.DOCKER_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build (no push)
        if: github.event_name == 'pull_request' || env.HAVE_TOKEN != 'true'
        env:
          HAVE_TOKEN: ${{ secrets.DOCKER_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lifeos
          cache-to: type=gha,mode=max,scope=lifeos

      - name: Build & push
        if: github.event_name != 'pull_request' && env.HAVE_TOKEN == 'true'
        env:
          HAVE_TOKEN: ${{ secrets.DOCKER_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lifeos
          cache-to: type=gha,mode=max,scope=lifeos

  # ── Container-integration smoke ──────────────────────────────────────────────
  # Runs after docker built the image locally. Verifies the same-origin rewrite,
  # auth boundaries, and that both processes come up healthy inside one container.
  container-smoke:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Start compose stack
        run: |
          cat > .env <<EOF
          LIFEOS_PORT=3000
          JOURNAL_SUBDIR=Journal
          EOF
          mkdir -p .no-vault
          docker compose up -d --build --wait
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/_lifeos-api/health >/dev/null 2>&1; then
              echo "container up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/_lifeos-api/health
          echo ""

          # Fresh instance: no account configured yet
          STATUS=$(curl -s http://localhost:3000/_lifeos-api/session/status)
          echo "session/status: $STATUS"
          test "$(echo $STATUS | python3 -c 'import json,sys;print(json.load(sys.stdin)["configured"])')" = "False"

          # /profile is 401 before setup (no session, no API token)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/_lifeos-api/profile)" = "401"

          # Set up account + mint API token in one sequence
          COOKIE=$(curl -s -X POST http://localhost:3000/_lifeos-api/session/setup \
            -H 'Content-Type: application/json' \
            -d '{"username":"citest","password":"cipass12"}' \
            -c /tmp/ci-cookie.txt 2>/dev/null; grep lifeos_session /tmp/ci-cookie.txt | awk '{print $6"="$7}')
          API_TOKEN=$(curl -s -X POST http://localhost:3000/_lifeos-api/api-tokens \
            -H 'Content-Type: application/json' \
            -H "Cookie: $COOKIE" \
            -d '{"name":"ci-smoke"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          echo "API token minted: ${API_TOKEN:0:12}..."

          # Session cookie auth works
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: $COOKIE" http://localhost:3000/_lifeos-api/profile)" = "200"
          # API token Bearer auth works
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $API_TOKEN" http://localhost:3000/_lifeos-api/profile)" = "200"
          # API token cannot access /api-tokens (session-only endpoint)
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $API_TOKEN" http://localhost:3000/_lifeos-api/api-tokens)" = "403"
          # Frontend loads
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200"
          # Backend NOT publicly reachable on host port 8787
          test "$(curl -s -o /dev/null --max-time 3 -w '%{http_code}' http://localhost:8787/health 2>&1)" != "200"
          echo "container-smoke passed"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
