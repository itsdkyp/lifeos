name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (leave blank to derive from git ref)"
        required: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: itsdkyp/lifeos

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short,enable=true
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.HAVE_TOKEN == 'true'
        env:
          HAVE_TOKEN: ${{ secrets.DOCKER_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build (no push)
        if: github.event_name == 'pull_request' || env.HAVE_TOKEN != 'true'
        env:
          HAVE_TOKEN: ${{ secrets.DOCKER_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lifeos
          cache-to: type=gha,mode=max,scope=lifeos

      - name: Build & push
        if: github.event_name != 'pull_request' && env.HAVE_TOKEN == 'true'
        env:
          HAVE_TOKEN: ${{ secrets.DOCKER_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Multi-arch: covers amd64 (VPS/desktop) and arm64 (Apple Silicon / Pi 5 / Graviton).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=lifeos
          cache-to: type=gha,mode=max,scope=lifeos

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start compose stack
        env:
          LIFEOS_TOKEN: ci-token-${{ github.run_id }}-not-secret
        run: |
          cat > .env <<EOF
          LIFEOS_TOKEN=$LIFEOS_TOKEN
          LIFEOS_PORT=3000
          JOURNAL_SUBDIR=Journal
          EOF
          mkdir -p .no-vault
          docker compose up -d --build --wait
          # give the entrypoint time to start both processes and become healthy
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/_lifeos-api/health >/dev/null 2>&1; then
              echo "container up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/_lifeos-api/health
          echo ""
          # 401 without token via the rewrite
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/_lifeos-api/profile)" = "401"
          # 200 with token
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $LIFEOS_TOKEN" http://localhost:3000/_lifeos-api/profile)" = "200"
          # Frontend HTML also serves
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200"
          echo "single-container smoke test passed"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
