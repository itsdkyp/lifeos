name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (leave blank to derive from git ref)"
        required: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # Both backend and frontend push under this single repo, distinguished by the -backend / -frontend tag suffix.
  IMAGE: itsdkyp/lifeos

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # For a push to main -> tag "backend-latest" / "frontend-latest" (or the matrix suffix)
          # For a git tag vX.Y.Z -> "backend-vX.Y.Z" and "backend-latest"
          # For a workflow_dispatch with input -> whatever the user picked
          flavor: |
            prefix=${{ matrix.component }}-,onlatest=true
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=${{ matrix.component }}-sha-,format=short,enable=true
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Log in to Docker Hub
        # Only push on merges to main or version tags, not on PRs (secrets aren't available on fork PRs).
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ${{ matrix.component }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          # Multi-arch: covers both amd64 (VPS/desktop) and arm64 (Apple Silicon / Raspberry Pi 5 / AWS Graviton).
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    # Only run when we actually pushed (i.e. not on PRs, not on skipped builds).
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start compose stack
        env:
          LIFEOS_TOKEN: ci-token-${{ github.run_id }}-not-secret
        run: |
          # Use the just-pushed :backend-<sha-short> tag and matching frontend tag.
          # The compose file builds locally by default, so override the images.
          SHORT_SHA=$(git rev-parse --short HEAD)
          cat > .env <<EOF
          LIFEOS_TOKEN=$LIFEOS_TOKEN
          BACKEND_PORT=8787
          FRONTEND_PORT=3000
          NEXT_PUBLIC_API_URL=http://localhost:8787
          JOURNAL_SUBDIR=Journal
          EOF
          mkdir -p .no-vault
          docker compose up -d --build --wait
          # Give the backend a moment to run migrations.
          sleep 5
          curl -fsS http://localhost:8787/health
          echo ""
          # 401 without token
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/profile)" = "401"
          # 200 with token
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $LIFEOS_TOKEN" http://localhost:8787/profile)" = "200"
          echo "smoke test passed"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
