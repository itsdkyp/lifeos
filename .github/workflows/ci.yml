name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Backend deps
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Backend typecheck
        working-directory: backend
        run: bunx tsc --noEmit

      - name: Frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend typecheck
        working-directory: frontend
        run: bunx tsc --noEmit

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Backend deps
        working-directory: backend
        run: bun install --frozen-lockfile

      - name: Start backend in background
        working-directory: backend
        run: |
          nohup bun run src/index.ts > /tmp/backend.log 2>&1 &
          # wait for /health
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then
              echo "backend up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend never came up:"
          cat /tmp/backend.log
          exit 1

      - name: Run 43-check smoke suite
        working-directory: backend
        run: bun run smoke

      - name: Backend logs on failure
        if: failure()
        run: cat /tmp/backend.log
