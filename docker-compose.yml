services:
  lifeos:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Optional: bake the token into the browser bundle so every device is authed
        # without needing to paste it into Settings -> Security. Skip for flexibility.
        NEXT_PUBLIC_LIFEOS_TOKEN: ${NEXT_PUBLIC_LIFEOS_TOKEN:-}
    image: lifeos
    container_name: lifeos
    restart: unless-stopped
    ports:
      # Only ONE port exposed. The backend runs on 127.0.0.1:8787 INSIDE the container
      # and is unreachable from outside. All browser traffic goes through :3000, which
      # proxies to the backend via the Next.js rewrite in next.config.ts.
      - "${LIFEOS_PORT:-3000}:3000"
    environment:
      # REQUIRED whenever the port is reachable beyond localhost. Generate:
      #   openssl rand -hex 32
      LIFEOS_TOKEN: ${LIFEOS_TOKEN:-}
      # Container timezone — controls how the backend buckets "today" via SQL's
      # date(ts,'localtime'). Set to your local TZ (e.g. Asia/Kolkata, Europe/Berlin,
      # America/New_York) so day-based aggregates match your wall clock. Defaults
      # to the host's TZ env when set, else UTC.
      TZ: ${TZ:-UTC}
      # CORS: origins the frontend can use. For same-container use, browser and backend
      # share an origin so this only matters if you serve the frontend from a different
      # host and expose the backend directly (rare with this compose file).
      LIFEOS_CORS_ORIGIN: ${LIFEOS_CORS_ORIGIN:-http://localhost:3000}
      JOURNAL_SUBDIR: ${JOURNAL_SUBDIR:-Journal}
      VAULT_PATH: /vault
    volumes:
      # SQLite DB persists across container recreates.
      - lifeos-data:/data
      # Obsidian vault \u2014 optional. Bind-mount your vault via VAULT_PATH in .env,
      # otherwise a placeholder empty dir is mounted so the backend has somewhere to write.
      - ${VAULT_PATH:-./.no-vault}:/vault

volumes:
  lifeos-data:
